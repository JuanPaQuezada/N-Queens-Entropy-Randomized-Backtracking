name: Compilar Ejecutable Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Esto te permite ejecutarlo manualmente con un botón

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter matplotlib numpy pyinstaller

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --paths . src/main.py

    - name: Guardar el .exe para descargarlo
      uses: actions/upload-artifact@v4
      with:
        name: N-Queens-Windows-Exe
        path: dist/main.exe
